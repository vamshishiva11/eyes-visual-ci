name: Recheck Eyes status

# Run after accepting or rejecting differences in the Eyes dashboard.
# It re-reads the batch for the PR's head commit and refreshes the comment and status; no tests run.
#   - Primary: Actions tab -> Run workflow, with the PR number.
#   - Secondary: comment `/recheck` on the pull request.
# Both triggers only work once this file is on the default branch.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write # PR comment
  statuses: write      # commit status on the PR head

jobs:
  recheck:
    # Comments only count when they are on a PR, start with /recheck, and come from someone with write-level access.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/recheck') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ inputs.pr_number || github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --import tsx scripts/recheck.ts
